openapi: 3.1.0
info:
  title: 黑米姐姐 API
  version: 0.2.0
  description: 消费者端、门店端和平台管理端共用接口契约。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发环境
tags:
  - name: Health
    description: 服务健康检查
paths:
  /health:
    get:
      tags: [Health]
      summary: 查询 API 健康状态
      operationId: getHealth
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthApiResponse"
components:
  schemas:
    HealthApiResponse:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/HealthStatus"
        requestId:
          type: [string, "null"]
        timestamp:
          type: string
          format: date-time
    HealthStatus:
      type: object
      required: [status, application, version, timestamp]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        application:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
